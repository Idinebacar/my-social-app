{% load static %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            <i class="fa-solid fa-share-nodes me-1"></i> Social
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}"><i class="fa-solid fa-house me-1"></i> Feed</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'profile_list' %}"><i class="fa-solid fa-users me-1"></i> Profiles</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'search' %}"><i class="fa-solid fa-magnifying-glass me-1"></i> Search</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto align-items-center">
                {% if user.is_authenticated %}
                <li class="nav-item me-3">
                    <a class="nav-link d-flex align-items-center" href="{% url 'profile' request.user.id %}">
                        {% if user.profile.profile_image %}
                        <img src="{{ user.profile.profile_image.url }}" class="rounded-circle me-2 object-fit-cover" width="30" height="30" alt="Profile">
                        {% else %}
                        <img src="{% static 'images/default_profile_pic.png' %}" class="rounded-circle me-2 object-fit-cover" width="30" height="30" alt="Profile">
                        {% endif %}
                        <span class="fw-semibold">@{{ request.user.username }}</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">
                        <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
                    </a>
                </li>
                {% else %}
                <li class="nav-item me-2">
                    <a class="nav-link" href="{% url 'login' %}">Login</a>
                </li>
                <li class="nav-item">
                    <a class="btn btn-light btn-sm text-primary fw-semibold" href="{% url 'register' %}">Register</a>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
