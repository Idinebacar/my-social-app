{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-danger">
                <div class="card-body text-center p-4">
                    <div class="mb-3 text-danger fs-1">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <h3 class="card-title mb-3">Delete Post?</h3>
                    <p class="text-muted mb-4">Are you sure you want to delete this post? This action cannot be undone.</p>

                    <div class="card bg-light mb-4 text-start">
                        <div class="card-body small text-secondary">
                            "{{ post.content }}"
                        </div>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger">Yes, Delete Post</button>
                            <a href="{% url 'post_show' post.id %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
